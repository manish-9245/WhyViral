<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="WhyViral — AI watches every video, then tells you exactly why it worked">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e0d0b"/>
      <stop offset="1" stop-color="#1a1814"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="inkInk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a0b"/>
      <stop offset="100" stop-color="#1f1f23"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- amber rule across top -->
  <rect x="0" y="0" width="1280" height="4" fill="url(#amber)"/>

  <!-- logo tile: ink square + flame-question mark + amber pin + sparks -->
  <g transform="translate(96, 230)">
    <rect width="180" height="180" rx="28" fill="url(#inkInk)"/>

    <!-- faint string-board grid -->
    <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
      <line x1="28" y1="40" x2="152" y2="40"/>
      <line x1="28" y1="72" x2="152" y2="72"/>
      <line x1="28" y1="108" x2="152" y2="108"/>
      <line x1="28" y1="140" x2="152" y2="140"/>
    </g>

    <!-- Question mark — amber flame, scaled 2.8x from the 64x64 logo -->
    <g transform="translate(28, 28) scale(2.0625)">
      <path
        d="M 22 18
           C 19 21, 18 27, 22 33
           C 25 37, 29 38, 30 39
           L 30 42
           C 30 42, 29 42, 29 44
           C 29 47, 30 49, 32 49
           C 34 49, 35 47, 35 44
           C 35 42, 34 42, 34 42
           L 34 39
           C 36 37, 39 36, 41 33
           C 46 27, 45 21, 42 18
           C 40 16, 37 14, 32 13
           C 28 12, 24 14, 22 18 Z"
        fill="url(#amber)"/>
      <circle cx="32" cy="52" r="3.6" fill="url(#amber)"/>
      <circle cx="48" cy="12" r="1.6" fill="#fde68a"/>
      <circle cx="52" cy="18" r="1.2" fill="#fbbf24" fill-opacity="0.8"/>
      <circle cx="16" cy="14" r="1.2" fill="#fbbf24" fill-opacity="0.8"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g transform="translate(312, 240)">
    <text x="0" y="60" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="120" font-weight="800" fill="#f5f1ea" letter-spacing="-4">WhyViral</text>
    <text x="6" y="115" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="500" fill="#f59e0b" letter-spacing="6">v1.0  ·  LOCAL-FIRST  ·  OPEN SOURCE</text>
  </g>

  <!-- Tagline -->
  <g transform="translate(312, 392)">
    <text x="0" y="0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="600" fill="#f5f1ea">AI watches every video. Then tells you exactly why it worked.</text>
    <text x="0" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#a8a29e">TikTok · Instagram · Meta  →  hooks, visuals, angles — pinned with proof links</text>
  </g>

  <!-- Footer band -->
  <g transform="translate(0, 568)">
    <line x1="96" y1="0" x2="1184" y2="0" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="96" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#a8a29e">github.com/manish-9245/WhyViral</text>
    <text x="1184" y="36" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#f59e0b">by Manish Tiwari</text>
  </g>
</svg>
