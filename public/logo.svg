<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="WhyViral logo">
  <defs>
    <linearGradient id="viralFlame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="55%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="inkInk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0b"/>
      <stop offset="100%" stop-color="#1f1f23"/>
    </linearGradient>
  </defs>

  <!-- Rounded ink tile (the bench) -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#inkInk)"/>

  <!-- Faint grid lines (string board hint) -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="10" y1="14" x2="54" y2="14"/>
    <line x1="10" y1="26" x2="54" y2="26"/>
    <line x1="10" y1="38" x2="54" y2="38"/>
    <line x1="10" y1="50" x2="54" y2="50"/>
  </g>

  <!-- Question mark stem with flame top (the "why" fused with "viral") -->
  <!-- The curve of the question mark is shaped like a flame tip -->
  <path d="
    M 22 22
    C 22 14, 30 10, 36 14
    C 42 18, 42 26, 36 30
    C 32 32, 30 34, 30 38
    L 30 40
  "
    fill="none"
    stroke="url(#viralFlame)"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Question mark dot, glowing amber pin -->
  <circle cx="30" cy="48" r="3.6" fill="url(#viralFlame)"/>

  <!-- Tiny spark above the flame (a viral moment) -->
  <circle cx="46" cy="16" r="1.4" fill="#fde68a"/>
  <circle cx="50" cy="22" r="1" fill="#fbbf24" fill-opacity="0.7"/>
  <circle cx="18" cy="18" r="1" fill="#fbbf24" fill-opacity="0.7"/>

  <!-- String from the pin to the wall (evidence thread) -->
  <line x1="30" y1="48" x2="30" y2="56" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="2 2" stroke-opacity="0.6"/>
</svg>
