name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Ensure required directories exist
        run: |
          mkdir -p output
          [ -f output/analyses.json ] || echo '{}' > output/analyses.json

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npx --no-install next lint --dir src || echo "lint warnings allowed"

      - name: Build
        run: npm run build
        env:
          APIFY_TOKEN: ""
          GEMINI_API_KEY: ""
