name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: typecheck · lint · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx --no-install next lint --dir src
      - run: npm run build
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN || 'ci-stub' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'ci-stub' }}
