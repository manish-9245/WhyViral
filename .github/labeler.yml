# Auto-label by changed paths (actions/labeler@v5)
# See https://github.com/actions/labeler

frontend:
  - changed-files:
      - any-glob-to-any-file: src/app/**/*

api:
  - changed-files:
      - any-glob-to-any-file: src/app/api/**/*

pipeline:
  - changed-files:
      - any-glob-to-any-file: src/mastra/**/*

backend:
  - changed-files:
      - any-glob-to-any-file:
          - src/app/api/**/*
          - src/mastra/**/*

docs:
  - changed-files:
      - any-glob-to-any-file:
          - docs/**/*
          - "*.md"
          - .github/*.md

ci:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**/*

deps:
  - changed-files:
      - any-glob-to-any-file: package.json
