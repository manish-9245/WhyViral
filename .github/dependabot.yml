version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    labels: ["deps"]
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: next
        versions: ["16.x", "17.x"]
      - dependency-name: react
        versions: ["20.x"]
    groups:
      dev-dependencies:
        patterns: ["eslint*", "prettier*", "tailwind*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    labels: ["ci"]
    commit-message:
      prefix: ci
      include: scope
